pit</text><rect x="1050" y="24" width="358" height="30" rx="15" fill="#2b2c20" stroke="#62603c"/><text x="1066" y="44" fill="#f4bd68" font-size="10" font-weight="400">ENTWURF · BEISPIELDATEN · KEINE LIVE-UI</text><text x="238" y="116" fill="#91a8bc" font-size="11" font-weight="600">WORKSPACE</text><text x="238" y="155" fill="#e4edf5" font-size="28" font-weight="600">Dein Engineering-Workspace</text><text x="238" y="183" fill="#91a8bc" font-size="13" font-weight="400">Verbindungen an einem Ort verwalten. CAD und Druckvorbereitung bleiben davon getrennt.</text><text x="238" y="878" fill="#91a8bc" font-size="10" font-weight="400">VISUELLES KONZEPT 02 · Weiterentwicklung des bestehenden Cockpits · 21.10.2026</text><rect x="238" y="217" width="1170" height="72" rx="12" fill="#14212d" stroke="#293d4d"/><text x="260" y="242" fill="#91a8bc" font-size="11" font-weight="600">ARBEITSKONTEXT</text><text x="260" y="268" fill="#e4edf5" font-size="17" font-weight="600">Team pib · Entwicklung</text><text x="730" y="267" fill="#91a8bc" font-size="14" font-weight="400">Projekt: Camera Mount Plate</text><rect x="238" y="315" width="575" height="308" rx="12" fill="#14212d" stroke="#293d4d"/><text x="262" y="344" fill="#91a8bc" font-size="11" font-weight="600">CAD</text><text x="262" y="384" fill="#e4edf5" font-size="23" font-weight="600">Onshape</text><rect x="262" y="408" width="260" height="30" rx="15" fill="#153a34" stroke="#293d4d"/><text x="276" y="429" fill="#54d5cf" font-size="13" font-weight="400">Verbunden</text><text x="262" y="473" fill="#91a8bc" font-size="12" font-weight="400">Lesen verfügbar · Candidate-Schreiben gesondert freigeben</text><text x="262" y="501" fill="#91a8bc" font-size="12" font-weight="400">Status geprüft: Beispielansicht</text><rect x="262" y="550" width="245" height="40" rx="7" fill="#173b40" stroke="#54d5cf"/><text x="278" y="576" fill="#54d5cf" font-size="14" font-weight="600">Verbindung verwalten</text><rect x="833" y="315" width="575" height="308" r