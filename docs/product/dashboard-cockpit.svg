<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" font-size="14" role="img" aria-labelledby="title desc">
<title id="title">pib Engineering Cockpit – visueller Dashboard-Entwurf</title>
<desc id="desc">Dunkles Dashboard mit Workspace, Candidate-Auswahl, CAD-Vergleich und getrennten Anzeigen für Freigabe, Ausführung und Prüfung. Alle Inhalte sind illustrative Beispieldaten, keine Runtime-Belege. Statischer Produktmockup ohne Funktionen.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#080e16"/></linearGradient>
  <linearGradient id="face" x2="0.7" y2="1"><stop stop-color="#667d91"/><stop offset="1" stop-color="#2d4357"/></linearGradient>
  <linearGradient id="candidateFace" x2="0.7" y2="1"><stop stop-color="#5c8e9d"/><stop offset="1" stop-color="#2a5264"/></linearGradient>
  <radialGradient id="stage"><stop stop-color="#1c3040"/><stop offset="1" stop-color="#101b27"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#405367" stroke-opacity=".2" stroke-width=".7"/></pattern>
  <filter id="shadow" x="-40%" y="-60%" width="180%" height="240%"><feGaussianBlur stdDeviation="14"/></filter>
  <g id="plate">
    <ellipse cx="190" cy="140" rx="172" ry="27" fill="#02070b" opacity=".65" filter="url(#shadow)"/>
    <path d="M0 50 150 140 380 50 380 69 150 159 0 69Z" fill="#192d3d" stroke="#547184" stroke-width="1.2"/>
    <path d="M150 140V159L380 69V50Z" fill="#254456"/>
    <path d="M0 50 230 -40 380 50 150 140Z" fill="url(#face)" stroke="#8ba6b8" stroke-width="1.4"/>
    <path d="M7 51 230 -34 373 51 150 134Z" fill="none" stroke="#b1c4cf" stroke-opacity=".2"/>
  </g>
  <g id="hole"><ellipse rx="18" ry="10" fill="#0a1520" stroke="#b2c8d1" stroke-width="1.5"/><path d="M-15 5 Q0 -4 15 5" fill="none" stroke="#4c6d81" stroke-width="2"/></g>
  <g id="largeHole"><ellipse rx="24" ry="13" fill="#09151e" stroke="#f3b66a" stroke-width="2"/><path d="M-21 6 Q0 -6 21 6" fill="none" stroke="#566b72" stroke-width="2"/><ellipse rx="31" ry="18" fill="none" stroke="#f3b66a" stroke-opacity=".4" stroke-dasharray="3 4"/></g>
  <g id="check"><circle r="9" fill="#1b3d35"/><path d="m-4 0 3 3 5-6" fill="none" stroke="#71d4b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#e3ebf4}
    .muted{fill:#8fa3b7}.dim{fill:#637d94}.small{font-size:12px}.tiny{font-size:11px}.mono{font-family:monospace;font-size:12px}.label{font-size:11px;letter-spacing:1.8px;fill:#8299ae}.cyan{fill:#60d4d1}.green{fill:#81d9b6}.amber{fill:#edbc7d}.white{fill:#f3f7fb}.line{stroke:#263849;stroke-width:1}.card{fill:#141f2c;stroke:#28394a;stroke-width:1}
  </style>
